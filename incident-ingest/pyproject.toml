[project]
name = "garland_tx_data_analysis"
version = "0.1.0"
description = "Garland TX weekly incident report pipeline, as a LangGraph deep agent"
authors = [{ name = "Your Name", email = "you@example.com" }]
# deepagents requires 3.11+.
requires-python = ">=3.11,<3.15"
dependencies = [
    "deepagents>=0.7,<1.0",
    # deepagents pulls langchain-anthropic in already; pinned explicitly because
    # the agent addresses models as `anthropic:<id>` and depends on it directly.
    "langchain-anthropic>=1.5,<2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.12.5",
    # tools.py imports `pypdf`. PyPDF2 was declared here instead — its
    # deprecated predecessor — and the real import only resolved because a
    # transitive dependency happened to pull pypdf in.
    "pypdf>=5",
    "requests",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
# `gepa` is the prompt optimiser used by `optimize_summary_prompt`, and is not
# imported by anything the weekly pipeline runs. It is the standalone library,
# not DSPy: `dspy.GEPA` wraps the same package for DSPy programs, and this
# project has no DSPy in it.
dev = ["pytest>=8", "gepa>=0.1.4,<0.2"]

[project.scripts]
garland_tx_data_analysis = "garland_tx_data_analysis.main:run"
run_agent = "garland_tx_data_analysis.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
